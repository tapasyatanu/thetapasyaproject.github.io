<style>
  :root {
    --white: #f5f5f7; --grey: #86868b; --dim: #3a3a3d; --blue: #2997ff;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", sans-serif;
    --gap: 12px; --row: 320px; --radius: 18px;
    --ease: cubic-bezier(.25,.1,.25,1);
    --orb: radial-gradient(circle at 34% 30%, #fff3a6 0%, #ffcf3f 14%, #ff5ea8 42%, #c44dff 72%, #5b22c9 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: #000; color: var(--white); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Nav (appears after the opening) ---------- */
  .nav { position: fixed; inset: 0 0 auto 0; z-index: 10; height: 48px;
         background: rgba(22,22,23,.72); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
         border-bottom: 1px solid rgba(255,255,255,.06);
         transform: translateY(-100%); transition: transform .5s var(--ease); }
  .nav.show { transform: none; }
  .nav .in { max-width: 1024px; height: 100%; margin: 0 auto; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; }
  .nav .brand img { height: 22px; display: block; }
  .nav nav a { font-size: 12px; color: rgba(245,245,247,.8); margin-left: 28px; }
  .nav nav a:hover { color: #fff; }

  /* ---------- Opening: scroll-driven ---------- */
  .intro { position: relative; height: 260vh; }
  .stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; }
  .stage > * { position: absolute; will-change: transform, opacity; }
  .photo { inset: 0; opacity: 0; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.55); }
  .corner { width: 20px; height: 20px; border: 0 solid var(--white); left: 0; top: 0; }
  .corner.tl { border-left-width: 1.5px; border-top-width: 1.5px; }
  .corner.br { border-right-width: 1.5px; border-bottom-width: 1.5px; }
  .orb { left: 0; top: 0; width: 16px; height: 16px; }
  .orb i, .pop, .rec, .mini .d { display: block; border-radius: 50%; background: var(--orb); }
  .orb i { width: 100%; height: 100%; position: relative; animation: pulse 2.2s ease-in-out infinite; }
  .orb i::after { content: ""; position: absolute; inset: -140%; border-radius: 50%;
                  background: radial-gradient(circle, rgba(255,94,168,.35) 0%, rgba(196,77,255,.12) 40%, transparent 70%); animation: halo 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  @keyframes halo { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
  .title { left: 50%; top: 50%; width: min(74vw, 760px); opacity: 0; }
  .title svg { width: 100%; height: auto; display: block; overflow: visible; }
  .pop { left: 0; top: 0; width: 10px; height: 10px; transform: scale(0); }
  .tagline { left: 0; right: 0; text-align: center; font-size: clamp(17px, 2vw, 21px); font-weight: 500; color: rgba(245,245,247,.8); letter-spacing: -.01em; opacity: 0; }
  .hint { left: 0; right: 0; bottom: 34px; text-align: center; font-size: 12px; color: var(--grey); letter-spacing: .02em; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { translate: 0 0; } 50% { translate: 0 6px; } }

  /* ---------- Story ---------- */
  .story { max-width: 980px; margin: 0 auto; padding: 18vh 22px 18vh; }
  .story p { font-size: clamp(36px, 6vw, 72px); font-weight: 600; letter-spacing: -.035em; line-height: 1.12; color: var(--dim); transition: color .7s var(--ease); margin-bottom: .32em; }
  .story p.lit { color: var(--white); }
  .story p.small { font-size: clamp(24px, 3.4vw, 40px); }
  .story p.final { margin-top: 1.1em; }
  .story p.final.lit { background: linear-gradient(90deg, #ffd88a 0%, #ff8fb8 35%, #d77bff 70%, #8f6bff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* ---------- Gallery ---------- */
  .head { max-width: 1024px; margin: 0 auto; padding: 0 22px 40px; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .head h2 { font-size: clamp(40px, 5.6vw, 64px); font-weight: 700; letter-spacing: -.04em; line-height: 1.05; }
  .head span { font-size: 17px; color: var(--grey); padding-bottom: 8px; display: inline-flex; align-items: center; gap: 10px; }
  .rec { width: 9px; height: 9px; animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .fade { opacity: 0; transform: translateY(40px); transition: opacity 1s var(--ease), transform 1s var(--ease); }
  .fade.in { opacity: 1; transform: none; }
  .gallery { max-width: 1440px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: var(--gap); padding: 0 var(--gap); }
  .gallery::after { content: ""; flex-grow: 999999; }
  .tile { position: relative; height: var(--row); flex-grow: 1; overflow: hidden; border-radius: var(--radius); background: #1d1d1f; cursor: zoom-in; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .8s var(--ease); }
  .tile:hover img { transform: scale(1.03); }
  /* callback: viewfinder corners on hover */
  .tile::before, .tile::after { content: ""; position: absolute; z-index: 1; width: 22px; height: 22px; border: 0 solid rgba(255,255,255,.9); opacity: 0; transition: opacity .4s var(--ease), transform .5s var(--ease); pointer-events: none; }
  .tile::before { left: 14px; top: 14px; border-left-width: 1.5px; border-top-width: 1.5px; transform: translate(-8px,-8px); }
  .tile::after { right: 14px; bottom: 14px; border-right-width: 1.5px; border-bottom-width: 1.5px; transform: translate(8px,8px); }
  .tile:hover::before, .tile:hover::after { opacity: 1; transform: none; }

  /* ---------- Ending: the frame closes on nothing ---------- */
  .end { text-align: center; padding: 26vh 22px 22vh; }
  .mini { position: relative; width: 64px; height: 64px; margin: 0 auto 44px; }
  .mini .c { position: absolute; width: 26px; height: 26px; border: 0 solid var(--white); transition: transform 1.4s var(--ease) .2s; }
  .mini .c.a { left: 0; top: 0; border-left-width: 1.5px; border-top-width: 1.5px; transform: translate(-40px,-40px); }
  .mini .c.b { right: 0; bottom: 0; border-right-width: 1.5px; border-bottom-width: 1.5px; transform: translate(40px,40px); }
  .mini .d { position: absolute; width: 11px; height: 11px; right: -20px; bottom: -4.75px; opacity: 0; transition: opacity .6s 1.4s; }
  .end.in .mini .c { transform: none; }
  .end.in .mini .d { opacity: 1; animation: blink 1.6s ease-in-out 2s infinite; }
  .end h2 { font-size: clamp(44px, 7.4vw, 96px); font-weight: 700; letter-spacing: -.045em; line-height: 1.04; }
  .end p { font-size: clamp(19px, 2.2vw, 24px); color: var(--grey); margin-top: 18px; letter-spacing: -.01em; }
  .end a { display: inline-block; margin-top: 36px; font-size: 17px; color: var(--blue); }

  footer { border-top: 1px solid #1d1d1f; max-width: 1024px; margin: 0 auto; padding: 22px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--grey); }
  footer img { height: 14px; display: block; opacity: .7; }

  /* ---------- Lightbox ---------- */
  .lb { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.96); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
        display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .35s var(--ease); }
  .lb.open { opacity: 1; pointer-events: auto; }
  .lb img { max-width: 92vw; max-height: 80vh; object-fit: contain; border-radius: 12px; transition: opacity .3s var(--ease); }
  .lb img.fading { opacity: 0; }
  .lb .cap { margin-top: 18px; font-size: 14px; color: var(--grey); min-height: 1.2em; }
  .lb .btn { position: absolute; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.12); color: #fff; font: 400 22px/44px var(--font); cursor: pointer; }
  .lb .btn:hover { background: rgba(255,255,255,.22); }
  .lb .close { top: 20px; right: 20px; font-size: 18px; }
  .lb .prev { left: 20px; top: 50%; transform: translateY(-50%); }
  .lb .next { right: 20px; top: 50%; transform: translateY(-50%); }
  .lb .num { position: absolute; top: 32px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--grey); pointer-events: none; }

  @media (max-width: 734px) {
    :root { --row: 180px; --gap: 6px; --radius: 12px; }
    .nav nav a { margin-left: 18px; }
    .title { width: 68vw; }
    .lb .prev, .lb .next { display: none; }
    .tile::before, .tile::after { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .intro { height: 100vh; height: 100svh; }
    .fade { opacity: 1; transform: none; } .story p { color: var(--white); }
    .end .mini .c { transform: none; } .end .mini .d { opacity: 1; }
  }
</style>
</head>

<script>
const $ = id => document.getElementById(id);
const GEO = {"vb": [3.2, -70.10000000000001, 598.6999999999999, 91.10000000000001], "frame": [-38.8, -100.10000000000001, 643.9, 51.0], "L": 30.0, "t": 3.0, "D": 20.0, "gap": 16.0};

/* ---------- Text ---------- */
$('tag').textContent = SITE.tagline;
$('gTitle').textContent = SITE.galleryTitle;
$('count').textContent = `${PHOTOS.length} frames. And counting.`;
$('endTitle').textContent = SITE.endTitle;
$('endText').textContent = SITE.endText;
if (SITE.contact) { $('contact').href = SITE.contact; $('contact').textContent = SITE.contactLabel; } else $('contact').remove();
$('copy').textContent = `© ${new Date().getFullYear()} Tapasyatanu Dash`;
SITE.story.forEach(([line, cls]) => {
  const p = document.createElement('p'); p.textContent = line; if (cls) p.className = cls; $('story').appendChild(p);
});
$('cover').src = SITE.cover;

/* ---------- Opening animation ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (p, a, b) => clamp((p - a) / (b - a));                 // progress of p within [a,b]
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const back = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const intro = $('top'), stage = $('stage'), title = $('title'), photo = $('photo');
const ctl = $('ctl'), cbr = $('cbr'), orb = $('orb'), pop = $('pop'), tag = $('tag'), hint = $('hint'), nav = $('nav');
let L = {};   // layout in px, recomputed on resize

function layout() {
  const W = stage.clientWidth, H = stage.clientHeight;
  const tw = title.offsetWidth, k = tw / GEO.vb[2], th = GEO.vb[3] * k;
  const cx = W / 2, cy = H / 2;
  const left = cx - tw / 2, top = cy - th / 2;              // title box on screen
  const X = u => left + (u - GEO.vb[0]) * k, Y = u => top + (u - GEO.vb[1]) * k;
  const M = clamp(Math.min(W, H) * .16, 60, 104);           // size of the closed frame
  L = {
    W, H, cx, cy, k,
    open:   { x1: X(GEO.frame[0]), y1: Y(GEO.frame[1]), x2: X(GEO.frame[2]), y2: Y(GEO.frame[3]), len: Math.max(10, GEO.L * k), t: Math.max(1.2, GEO.t * k) },
    closed: { x1: cx - M / 2, y1: cy - M / 2, x2: cx + M / 2, y2: cy + M / 2, len: M * .42, t: 1.5 },
    orb: M * .2,
    popD: Math.max(7, GEO.D * k),
  };
  L.popX = L.open.x2 + GEO.gap * k; L.popY = L.open.y2 - L.open.t / 2 - L.popD / 2;
  title.style.marginLeft = `${-tw / 2}px`; title.style.marginTop = `${-th / 2}px`;
  orb.style.width = orb.style.height = `${L.orb}px`;
  pop.style.width = pop.style.height = `${L.popD}px`;
  tag.style.top = `${L.open.y2 + Math.max(28, 40 * k * 1.2)}px`;
  frame();
}

function frame() {
  let p = reduced ? .66 : clamp(-intro.getBoundingClientRect().top / (intro.offsetHeight - L.H));

  // 1. Frame opens (0.04 → 0.46)
  const o = ease(seg(p, .04, .46)), c = L.closed, f = L.open;
  const x1 = lerp(c.x1, f.x1, o), y1 = lerp(c.y1, f.y1, o), x2 = lerp(c.x2, f.x2, o), y2 = lerp(c.y2, f.y2, o);
  const len = lerp(c.len, f.len, o), t = lerp(c.t, f.t, o);
  for (const [el, x, y] of [[ctl, x1, y1], [cbr, x2 - len, y2 - len]]) {
    el.style.width = el.style.height = `${len}px`;
    el.style.borderWidth = '0'; el.style[el === ctl ? 'borderLeftWidth' : 'borderRightWidth'] = `${t}px`;
    el.style[el === ctl ? 'borderTopWidth' : 'borderBottomWidth'] = `${t}px`;
    el.style.transform = `translate(${x}px, ${y}px)`;
  }

  // 2. Photo fades in inside the opening frame (0.08 → 0.45)
  const ph = ease(seg(p, .08, .45));
  photo.style.opacity = ph;
  photo.style.transform = `scale(${lerp(1.14, 1, ph)})`;

  // 3. Dot grows and melts into the title (0.12 → 0.42)
  const m = seg(p, .12, .42);
  orb.style.opacity = 1 - ease(m);
  orb.style.transform = `translate(${L.cx - L.orb / 2}px, ${L.cy - L.orb / 2}px) scale(${1 + ease(m) * 7})`;
  const ti = ease(seg(p, .22, .46));
  title.style.opacity = ti;
  title.style.transform = `scale(${lerp(.9, 1, ti)})`;

  // 4. A small dot pops out past the corner — the logo (0.48 → 0.6)
  pop.style.transform = `translate(${L.popX}px, ${L.popY}px) scale(${back(seg(p, .48, .6)) * (seg(p, .48, .6) > 0 ? 1 : 0)})`;

  // 5. Tagline (0.56 → 0.68)
  tag.style.opacity = ease(seg(p, .56, .68));
  tag.style.transform = `translateY(${lerp(12, 0, ease(seg(p, .56, .68)))}px)`;

  // 6. Everything fades out into the story (0.8 → 1)
  const out = 1 - ease(seg(p, .8, 1));
  for (const el of [ctl, cbr, title, tag]) el.style.opacity = (el === title ? ti : el === tag ? +tag.style.opacity : 1) * out;
  pop.style.opacity = out; photo.style.opacity = ph * out;

  hint.style.opacity = reduced ? 0 : 1 - seg(p, 0, .05);
  nav.classList.toggle('show', reduced ? window.scrollY > L.H * .6 : p >= 1);
}

let ticking = false;
addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { frame(); ticking = false; }); } }, { passive: true });
addEventListener('resize', layout);
layout();

/* ---------- Story lines light up in the middle of the screen ---------- */
const lit = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle('lit', e.isIntersecting)), { rootMargin: '-38% 0px -38% 0px' });
document.querySelectorAll('.story p').forEach(p => lit.observe(p));

/* ---------- Fade-ins ---------- */
const fader = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); fader.unobserve(e.target); } }), { rootMargin: '0px 0px -15% 0px' });
document.querySelectorAll('.head.fade, .end.fade').forEach(el => fader.observe(el));

/* ---------- Gallery ---------- */
PHOTOS.forEach((p, i) => {
  const tile = document.createElement('figure');
  tile.className = 'tile fade';
  tile.style.flexBasis = 'calc(var(--row) * 1.5)';
  tile.style.transitionDelay = `${(i % 3) * 80}ms`;
  const img = new Image();
  img.loading = 'lazy'; img.alt = p.caption || '';
  img.onload = () => { const r = img.naturalWidth / img.naturalHeight; tile.style.flexBasis = `calc(var(--row) * ${r})`; tile.style.flexGrow = r; };
  img.src = p.src;
  tile.appendChild(img);
  tile.onclick = () => show(i);
  $('gallery').appendChild(tile);
  fader.observe(tile);
});

/* ---------- Lightbox ---------- */
const lb = $('lb'), lbImg = $('lbImg');
let cur = 0;
function show(i) {
  cur = (i + PHOTOS.length) % PHOTOS.length;
  const p = PHOTOS[cur];
  lbImg.classList.add('fading');
  const pre = new Image(); pre.onload = () => { lbImg.src = p.src; lbImg.classList.remove('fading'); }; pre.src = p.src;
  $('lbCap').textContent = p.caption || '';
  $('num').textContent = `${cur + 1} of ${PHOTOS.length}`;
  lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  new Image().src = PHOTOS[(cur + 1) % PHOTOS.length].src;
}
function hide() { lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; }
lb.querySelector('.close').onclick = hide;
lb.querySelector('.prev').onclick = e => { e.stopPropagation(); show(cur - 1); };
lb.querySelector('.next').onclick = e => { e.stopPropagation(); show(cur + 1); };
lb.onclick = e => { if (e.target === lb) hide(); };
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') hide();
  if (e.key === 'ArrowLeft') show(cur - 1);
  if (e.key === 'ArrowRight') show(cur + 1);
});
let x0 = null;
lb.addEventListener('touchstart', e => x0 = e.touches[0].clientX, { passive: true });
lb.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1)); x0 = null; });
</script>
</body>
</html>
