<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>My Photos</title>
<style>
  :root { --gap: 6px; --row: 280px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #eee; font-family: -apple-system, system-ui, sans-serif; }
  header { padding: 32px 16px 20px; text-align: center; }
  header h1 { font-weight: 300; letter-spacing: .15em; text-transform: uppercase; font-size: 1.4rem; }
  header p { color: #888; margin-top: 6px; font-size: .9rem; }

  /* Justified grid: each photo grows in proportion to its aspect ratio */
  .gallery { display: flex; flex-wrap: wrap; gap: var(--gap); padding: 0 var(--gap) var(--gap); }
  .gallery::after { content: ""; flex-grow: 999999; }   /* stops the last row stretching */
  .tile { position: relative; height: var(--row); flex-grow: 1; cursor: zoom-in; background: #222; overflow: hidden; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
  .tile:hover img { transform: scale(1.03); }
  @media (max-width: 700px) { :root { --row: 160px; --gap: 3px; } }

  /* Lightbox */
  .lb { position: fixed; inset: 0; background: rgba(0,0,0,.95); display: none; align-items: center; justify-content: center; z-index: 10; }
  .lb.open { display: flex; }
  .lb img { max-width: 94vw; max-height: 88vh; object-fit: contain; }
  .lb button { position: absolute; background: none; border: 0; color: #fff; font-size: 2.4rem; padding: 16px; cursor: pointer; opacity: .7; }
  .lb button:hover { opacity: 1; }
  .lb .close { top: 4px; right: 8px; }
  .lb .prev { left: 4px; top: 50%; transform: translateY(-50%); }
  .lb .next { right: 4px; top: 50%; transform: translateY(-50%); }
  .lb .cap { position: absolute; bottom: 14px; width: 100%; text-align: center; color: #aaa; font-size: .9rem; }
</style>
</head>
<body>
<header>
  <h1>My Photos</h1>
  <p>A collection</p>
</header>

<main class="gallery" id="gallery"></main>

<div class="lb" id="lb">
  <button class="close" aria-label="Close">&times;</button>
  <button class="prev" aria-label="Previous">&#8249;</button>
  <img id="lbImg" alt="">
  <button class="next" aria-label="Next">&#8250;</button>
  <div class="cap" id="lbCap"></div>
</div>

<script>
/* ============ EDIT THIS LIST ============
   Put your photos in a "photos" folder next to this file,
   then list them here, e.g. { src: "photos/beach.jpg", caption: "Goa, 2025" }
   Sizes and orientations are detected automatically.
   The examples below are placeholders — delete them. */
const PHOTOS = [
  { src: "https://picsum.photos/id/1015/1600/1067", caption: "Landscape" },
  { src: "https://picsum.photos/id/1027/1000/1500", caption: "Portrait" },
  { src: "https://picsum.photos/id/1043/2400/800",  caption: "Panorama" },
  { src: "https://picsum.photos/id/1050/1200/1200", caption: "Square" },
  { src: "https://picsum.photos/id/1039/1600/1067", caption: "" },
  { src: "https://picsum.photos/id/1062/1000/1500", caption: "" },
  { src: "https://picsum.photos/id/1074/1600/900",  caption: "" },
  { src: "https://picsum.photos/id/1080/1000/1400", caption: "" },
  { src: "https://picsum.photos/id/110/1600/1067",  caption: "" },
  { src: "https://picsum.photos/id/1011/2000/1000", caption: "" },
];
/* ======================================== */

const gallery = document.getElementById('gallery');
const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'), lbCap = document.getElementById('lbCap');
let current = 0;

PHOTOS.forEach((p, i) => {
  const tile = document.createElement('div');
  tile.className = 'tile';
  tile.style.flexBasis = 'calc(var(--row) * 1.5)';  // provisional until size is known
  const img = new Image();
  img.loading = 'lazy';
  img.alt = p.caption || '';
  img.onload = () => {
    const ratio = img.naturalWidth / img.naturalHeight;
    tile.style.flexBasis = `calc(var(--row) * ${ratio})`;
    tile.style.flexGrow = ratio;
  };
  img.src = p.src;
  tile.appendChild(img);
  tile.onclick = () => open(i);
  gallery.appendChild(tile);
});

function open(i) {
  current = (i + PHOTOS.length) % PHOTOS.length;
  lbImg.src = PHOTOS[current].src;
  lbCap.textContent = PHOTOS[current].caption || '';
  lb.classList.add('open');
}
function close() { lb.classList.remove('open'); }
lb.querySelector('.close').onclick = close;
lb.querySelector('.prev').onclick = e => { e.stopPropagation(); open(current - 1); };
lb.querySelector('.next').onclick = e => { e.stopPropagation(); open(current + 1); };
lb.onclick = e => { if (e.target === lb) close(); };
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') close();
  if (e.key === 'ArrowLeft') open(current - 1);
  if (e.key === 'ArrowRight') open(current + 1);
});

/* Swipe on phones */
let x0 = null;
lb.addEventListener('touchstart', e => x0 = e.touches[0].clientX, { passive: true });
lb.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 50) open(current + (dx < 0 ? 1 : -1));
  x0 = null;
});
</script>
</body>
</html>
